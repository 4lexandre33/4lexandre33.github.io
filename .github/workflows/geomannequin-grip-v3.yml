name: GeoMannequin - Grip V3 Cadeiras
on:
  pull_request:
    paths:
      - "geomannequin/**"
      - ".github/workflows/geomannequin-grip-v3.yml"
  workflow_dispatch:
jobs:
  rigid-grip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: geomannequin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: |
          npm ci
          npm ci --prefix mcp
      - name: Verificar sintaxe
        run: |
          for f in src/engine/rigid-transform.js src/engine/grip-sites.js src/engine/objetos.js src/scene/grip-v3.js src/scene/contato-v2.js src/scene/modelo.js src/scene/estado.js src/scene/comandos.js src/ui/colisoes.js; do node --check "$f"; done
      - name: Geometria e ancoragem SE3
        run: node testes/grip-v3-se3.mjs
      - name: Cenário cadeira, duas mãos, filhos e JSON
        run: |
          node testes/grip-v3-cadeira.mjs
          node testes/grip-v3-regressoes.mjs
          node testes/grip-v3-fisica.mjs
          node testes/grip-v3-duas-maos.mjs
      - name: AutoGrip: geometria e contrato one-click
        run: npm run testar:autogrip
      - name: Regressao legada Contact V2
        run: node testes/contato-v2.mjs
      - name: Carregamento headless e roteiro
        run: |
          node testes/headless-modulos-integracao.mjs
          node testes/paridade-editor-codigo.mjs
      - name: Build da aplicacao
        run: npm run construir
      - name: Verificar sintaxe dos módulos MCP
        run: |
          for f in mcp/server.mjs mcp/lib/tools.mjs mcp/lib/tools-control.mjs mcp/lib/tools-storyboard.mjs mcp/scripts/source-fingerprint.mjs mcp/scripts/verify-dist.mjs mcp/test/control.mjs; do node --check "$f"; done
      - name: MCP source - stdio, HTTP, roteiros e controles V3
        run: |
          cd mcp
          npm test
      - name: Gerar e verificar distribuição MCP
        run: |
          cd mcp
          npm run build
          npm run verify:dist
          npm run test:dist
      - name: Bloquear dist desatualizado no Git
        run: git diff --exit-code -- mcp/dist
